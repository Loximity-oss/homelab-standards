# Inter-zone flow matrix (decision 8 — OPEN). Owner: Network Engineer. Not enforced yet; no UniFi firewall changes in v7.
# Proposal from design-v7 §3 (row initiates to column):
#   mgt -> shr, int, dmz, stg: allow
#   shr -> mgt: deny (pull-only) | shr -> int, dmz: service ports | shr -> stg: allow
#   int -> shr: DNS/PKI/IdP/proxy | int -> dmz: deny
#   dmz -> shr: DNS/proxy | dmz -> mgt, int, stg: deny
#   stg -> shr: DNS/PKI | stg -> mgt, dmz, int: deny   (stg has its own VLAN 60)
# wifi guest zone (Faris 2026-10-09; gateway-routed, so these are UDM zone-firewall policies, Class C):
#   shr (hm1-shr-cicd01 192.168.70.20) -> wifi guests: SSH 22 (Ansible, pipeline tests)
#   tru, wifi, iot, gst, int, dmz, stg -> wifi DNS guests (192.168.69.10-11): DNS 53 tcp/udp; tru -> admin UI 80/443
#   wifi guests -> internet: DNS 53 / DoT 853 / HTTPS 443 (upstreams, updates) | wifi guests -> shr: PKI/OpenBao 8200
#   wifi guests -> mgt, net, int, dmz, stg: deny
# iot guest zone (Faris 2026-10-11; gateway-routed like wifi, UDM zone-firewall policies, Class C):
#   shr (hm1-shr-cicd01 192.168.70.20) -> iot guests: SSH 22 (Ansible, pipeline tests)
#   iot clients -> iot DNS guests (192.168.74.10-11): DNS 53 tcp/udp (same L2, no firewall) | tru -> admin UI 80/443
#   iot guests -> internet: DNS 53 / DoT 853 / HTTPS 443 | iot guests -> shr: PKI/OpenBao 8200
#   iot guests -> mgt, net, int, dmz, stg, wifi: deny
flows: {}
