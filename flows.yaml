# Inter-zone flow matrix (decision 8 — OPEN). Owner: Network Engineer. Not enforced yet; no UniFi firewall changes in v7.
#
# Machine-readable part (schema v1, homelab-apps proposal 1.8; Class C). The comment matrix below stays the design
# record; `flows:` (end of file) holds the flows that are planned or live, as a mapping keyed by flow id.
# Readers: OpenClaw plan_from_catalog, the probe file_sd job (homelab-apps 4.3: targets in gateway-routed zones are
# emitted only for flows with `state: implemented`), reviewers. Writer: oc-net only (owners.yaml).
schema:
  version: 1
  id: '^[a-z0-9][a-z0-9-]*$'              # key of each entry under `flows:`
  endpoints:                               # `from` / `to`: one value or a list of values
    zone: a zone code from naming/zones.yaml (the whole zone cidr)
    host: a named host (homelab-infra spec hostname, or a reserved_ips entry in naming/zones.yaml); resolves to its IP
    internet: egress via the router of the source zone
    self: homelab-apps catalog.flows only (the deployment's hosts); never used in this file
    self-zone: homelab-apps catalog.flows only (other hosts in the same zone/L2, needs no rule); never used in this file
  ports: '^(icmp|[0-9]{1,5}(-[0-9]{1,5})?/(tcp|udp))$'   # e.g. 53/udp, 22/tcp, 8000-8010/tcp, icmp
  routers:                                 # `router` = where the flow is enforced (derived, stated for review)
    lox-gw-01: either endpoint lies in a zone with router lox-gw-01, or `to` is internet -> UDM zone-firewall policy
    lox-coresw-01: both endpoints in zones routed by lox-coresw-01 -> this entry only (no UDM policy)
  states:
    proposed: decided or requested, not (yet) confirmed in the network; consumers must not rely on it
    implemented: confirmed by oc-net with a read-only UniFi check on the date in `checked`
  entry:
    required: [from, to, ports, router, state, why]
    optional:
      policies: UniFi firewall policy names (router lox-gw-01; required when implemented, proposed names otherwise)
      checked: date of the last read-only UniFi check (required when implemented)
      ref: issue/PR/decision reference
#
# Proposal from design-v7 §3 (row initiates to column):
#   mgt -> shr, int, dmz, stg: allow
#   shr -> mgt: deny (pull-only) | shr -> int, dmz: service ports | shr -> stg: allow
#   int -> shr: DNS/PKI/IdP/proxy | int -> dmz: deny
#   dmz -> shr: DNS/proxy | dmz -> mgt, int, stg: deny
#   stg -> shr: DNS/PKI | stg -> mgt, dmz, int: deny   (stg has its own VLAN 60)
# wifi guest zone (Faris 2026-10-09; gateway-routed, so these are UDM zone-firewall policies, Class C):
#   shr (hm1-shr-cicd01 192.168.70.20) -> wifi guests: SSH 22 (Ansible, pipeline tests)
#   tru, wifi, iot, gst, int, dmz, stg -> wifi DNS guests (192.168.69.10-11): DNS 53 tcp/udp; tru -> admin UI 80/443
#   wifi guests -> internet: DNS 53 / DoT 853 / HTTPS 443 (upstreams, updates) | wifi guests -> shr: PKI/OpenBao 8200
#   wifi guests -> mgt, net, int, dmz, stg: deny
# iot guest zone (Faris 2026-10-11; gateway-routed like wifi, UDM zone-firewall policies, Class C):
#   shr (hm1-shr-cicd01 192.168.70.20) -> iot guests: SSH 22 (Ansible, pipeline tests)
#   iot clients -> iot DNS guests (192.168.74.10-11): DNS 53 tcp/udp (same L2, no firewall) | tru -> admin UI 80/443
#   iot guests -> internet: DNS 53 / DoT 853 / HTTPS 443 | iot guests -> shr: PKI/OpenBao 8200
#   iot guests -> mgt, net, int, dmz, stg, wifi: deny
# stg template-build host (Faris 2026-10-15, homelab-infra #53; reserved IP 192.168.76.250 in naming/zones.yaml;
# seal/verify boots of scratch VMs 9990-9992; stg is routed by lox-coresw-01, internet egress via lox-gw-01):
#   shr (hm1-shr-cicd01 192.168.70.20) -> internet: HTTPS 443 (vendor image mirrors; template runner download)
#   shr (hm1-shr-cicd01 192.168.70.20) -> template-build (192.168.76.250): SSH 22 (seal + verify)
#   template-build (192.168.76.250) -> internet: HTTP 80 / HTTPS 443 (pacman/dnf/apt mirrors, nix cache, github)
#   template-build (192.168.76.250) -> 1.1.1.1, 8.8.8.8: DNS 53 tcp/udp (exception to stg -> shr DNS)
#   template-build (192.168.76.250) -> mgt, net, shr, int, dmz, wifi, iot: deny (replies to CT 300 SSH only)
# OpenClaw dashboard (Faris 2026-10-15, homelab/openclaw e417d97; read-only, no auth, shows no secrets or tool output):
#   tru (Faris admin, 192.168.73.0/28) -> hm1-shr-aiops01 (192.168.70.13): HTTP 9180/tcp
#   no host firewall on CT 301: any zone that can route to shr reaches it (was CT 100 192.168.67.3 until 2026-10-24)
#
# UniFi implementation state of the gateway-routed guest flows (checked 2026-10-20 by oc-net, read-only).
# UniFi zones: shr/int/dmz/stg/tru/mgt networks -> zone 'Internal'; wifi 192.168.69.0/24, iot 192.168.74.0/24,
# gst 192.168.75.0/24 -> zone 'Untrusted Networks'. Internal -> Untrusted Networks is predefined 'Block All Traffic'.
#   wifi+iot  shr 192.168.70.20 -> 192.168.69.10-11, 192.168.74.10-11 tcp/22   IMPLEMENTED
#             one policy 'Allow SHRSVC to All DNS LXCs' (Internal -> Untrusted Networks; return auto-allowed);
#             it replaced 'Allow SHRSVC to IoT DNS LXC' (2026-10-17 state) and closes the wifi gap of homelab-infra #86
#   wifi+iot  CT 301 192.168.70.13 -> 192.168.69.10-11, 192.168.74.10-11 udp/53, tcp/22,80, icmp   IMPLEMENTED
#             three policies 'Allow AIOPS to DNS LXCs UDP 53 / TCP 22,80 / ICMP' (Internal -> Untrusted Networks;
#             created by Faris 2026-10-20 for 192.168.67.3, source changed to 192.168.70.13 by Faris 2026-10-24; entry aiops-dns-probes)
# GNS3 lab VM (Faris 2026-10-31; hm1-stg-net01, 192.168.76.10, VMID 810): tru (Faris admin) -> GNS3 server API/UI 3080/tcp and
# node consoles (GNS3 default console range is 5000-10000; narrowed to 5000-5099/tcp, widen by PR if more nodes are needed).
# tru is routed by lox-gw-01, stg by lox-coresw-01: the flow crosses the UDM (zone-firewall policy, Class C, not yet created).
# Internal-network DNS (tru/int/dmz/stg -> wifi DNS 53, tru -> wifi DNS admin UI 80/443): design pending Faris
# (2026-10-17). The 2026-10-09 lines above stay as recorded; nothing is planned or implemented for these until then.
# iot/gst -> wifi DNS 53: undecided (Faris open question).
flows:
  aiops-pve-api:
    from: hm1-shr-aiops01          # CT 301, 192.168.70.13 (shr reserved_ips)
    to: hm1-mgt-pve01              # 192.168.67.2 (mgt reserved_ips)
    ports: [8006/tcp, 9100/tcp, icmp]
    router: lox-coresw-01          # shr and mgt both routed by the core switch: no UDM policy
    state: proposed
    why: OpenClaw Proxmox tools + pve-exporter (8006), node exporter scrape (9100). Exception to shr -> mgt deny,
         like the CT 300 runners (Terraform, verify, snapshots); OpenClaw moved from mgt CT 100 on 2026-10-24
    ref: OpenClaw move to shr (2026-10-24)
  aiops-k3s-api:
    from: hm1-shr-aiops01          # CT 301, 192.168.70.13: same zone and L2 as the VIP, no rule needed
    to: shr                        # k3s API VIP 192.168.70.200 (svc_k3s_api_vip; not a named host)
    ports: [6443/tcp]
    router: lox-coresw-01          # same subnet since 2026-10-24: not routed at all
    state: proposed
    why: blackbox probe https://<vip>:6443/readyz (K3sAPIDown), homelab-apps 4.3 (was ct100-k3s-api)
    ref: homelab-infra #127; homelab-apps proposal 4-verification.md 4.3
  aiops-dns-probes:
    from: hm1-shr-aiops01          # CT 301, 192.168.70.13 only (not the whole shr zone; was ct100-dns-probes)
    to: [hm1-wifi-dns01, hm1-wifi-dns02, hm1-iot-dns01, hm1-iot-dns02]   # 192.168.69.10-11, 192.168.74.10-11
    ports: [53/udp, 22/tcp, 80/tcp, icmp]
    router: lox-gw-01              # Internal -> Untrusted Networks (predefined Block All)
    state: implemented
    checked: 2026-10-24             # from CT 301: icmp, 22/tcp, 80/tcp (302), 53/udp answer on all four IPs
    policies:                      # created by Faris 2026-10-20. Source zone Internal, IP 192.168.70.13 (was .67.3 until 2026-10-24);
                                   # destination zone Untrusted Networks, the four IPs; action allow, enabled
      - Allow AIOPS to DNS LXCs TCP 22,80
      - Allow AIOPS to DNS LXCs UDP 53
      - Allow AIOPS to DNS LXCs ICMP
    why: blackbox probes from CT 301 (icmp + ssh per guest; AdGuard dns_udp :53 and http_2xx :80), homelab-apps 4.3
    ref: homelab-infra #127; homelab-apps proposal 4-verification.md 4.3 (net R3)
  cicd-iot-app-ssh:
    from: hm1-shr-cicd01           # CT 300, 192.168.70.20
    to: hm1-iot-app01              # 192.168.74.12 (iot app guest, homelab-infra #179)
    ports: [22/tcp]
    router: lox-gw-01              # Internal -> Untrusted Networks (predefined Block All)
    state: proposed
    policies:                      # live policy lists only 192.168.74.10-11 and 192.168.69.10-11 as destinations
      - Allow DEVOPS to All DNS LXCs   # change: add 192.168.74.12 to its destination IPs (or rename, Faris decides)
    why: Ansible + pipeline tests reach the new iot app guest; Ansible failed with SSH timeout after the #179 apply
    ref: homelab-infra #179
  aiops-iot-app-ssh:
    from: hm1-shr-aiops01          # CT 301, 192.168.70.13
    to: hm1-iot-app01              # 192.168.74.12
    ports: [22/tcp, icmp]
    router: lox-gw-01
    state: proposed
    policies:
      - Allow AIOPS to DNS LXCs TCP 22,80   # add 192.168.74.12 to destination IPs (80 is not needed for app01)
      - Allow AIOPS to DNS LXCs ICMP        # add 192.168.74.12 to destination IPs
    why: SSH diagnostics and icmp probes from CT 301 to the iot app guest
    ref: homelab-infra #179
  tru-gns3-ui:
    from: tru                      # Faris admin clients, 192.168.73.0/28
    to: hm1-stg-net01              # 192.168.76.10 (GNS3 VM, VMID 810; spec comes with the guest PR)
    ports: [3080/tcp, 5000-5099/tcp]
    router: lox-gw-01              # tru is gateway-routed: UDM policy needed (Class C)
    state: proposed
    policies:
      - Allow TRU to GNS3 UI and consoles
    why: GNS3 web UI/API (3080) and node telnet consoles (5000-5099) of the lab VM; no other source
    ref: Faris 2026-10-31 GNS3 lab VM hm1-stg-net01
