# Who may change which homelab-standards file (design-v7 decisions 3 and 13). First matching glob wins;
# files not listed belong to faris. Enforced by the agents' tools (who_owns) AND by ci/classify.py on every PR:
# a PR touching a file its author does not own fails the check (faris may change anything).
owners:
  protected.yaml: [faris]
  owners.yaml: [faris]
  openbao/*: [faris]
  .gitea/*: [faris]
  naming/zones.yaml: [oc-net]
  flows.yaml: [oc-net]
  naming/vmid-ranges.yaml: [oc-infra]
  naming/roles.yaml: [oc-infra]
  naming/tags.yaml: [oc-infra]
  naming/services.yaml: [oc-infra]
  naming/secrets.yaml: [oc-infra]
  naming/sites.yaml: [faris]
  lint/*: [oc-infra]
  ci/*: [oc-infra]
  naming-conventions.md: [oc-infra, oc-net]
  README.md: [oc-infra, oc-net]
