# Non-zone VMID ranges. Zone blocks are in zones.yaml (vmid).
reserved_future_zones: [500, 799]
templates_linux: [9000, 9099]
templates_windows: [9100, 9199]
temporary: [9900, 9999]
core_slots: "x00-x09 of each zone block: foundational / protected guests"
# Template lifecycle (Faris decisions 1-7, 2026-10-15; standards PR #17).
# Templates stay clone-only for the apply token (protected.yaml, decision 32 D5; homelab-infra scripts/template-guard.py
# unchanged). They are built and refreshed only by the homelab-infra `template` workflow (runner host-template) with the
# builder token, from a reviewed spec. Never by guest Terraform stacks, never by an agent or a shell on the PVE host.
template_lifecycle:
  owner: oc-infra                      # writes specs, opens build/refresh PRs, keeps the catalogue current
  approver: faris                      # Class C: new/retired/renamed spec, settings, keys, nixos config, range/identity/rules
  minor_refresh_class: B               # only source.url/sha256/version/signature.url/nixpkgs_rev of an existing spec, same url host
  in_guest_requirements: configuration-engineer   # homelab-infra docs/apps/vm-templates.md
  specs: "homelab-infra terraform/templates/hm1/<vmid>-<name>.yaml"
  builder: "svc-tpl-build@pve!pipeline"   # role DevOpsTemplateBuild, per-VMID ACLs on builder_ranges + scratch, never a pool
  builder_ranges: [[9000, 9099]]       # Linux only, 9000 included (refresh); Windows 9100-9199 stays manual
  scratch: [9990, 9999]                # build / candidate / verify VMIDs inside 'temporary'; deleted by the build job
  import_storage: dir-import01         # dir storage, content import,backup; API upload only (no download-url, no Sys.Modify)
  build_ip: "naming/zones.yaml stg reserved_ips value 'template-build' (Network Engineer)"
  mgd_tag: tpl                         # mgd-tpl on pipeline-built templates (Faris 2026-10-15; 'tpl' as in naming-conventions 6.4)
  refresh_default: monthly
