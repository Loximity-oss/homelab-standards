# Non-zone VMID ranges. Zone blocks are in zones.yaml (vmid).
reserved_future_zones: [500, 799]
templates_linux: [9000, 9099]
templates_windows: [9100, 9199]
temporary: [9900, 9999]
core_slots: "x00-x09 of each zone block: foundational / protected guests"
# PROPOSED (Faris decides; companion changes to protected.yaml and openbao/ are Faris-owned).
# Templates stay clone-only for the apply token (protected.yaml, decision 32 D5; scripts/template-guard.py unchanged).
# They are built and refreshed only by the template pipeline (identity svc-tpl-build@pve!pipeline, per-VMID ACLs on
# builder_ranges + scratch only) from a reviewed spec in homelab-infra. Never by guest Terraform stacks, never by a shell.
template_lifecycle:
  owner: oc-infra                      # writes specs, opens build/refresh PRs, keeps the catalogue current
  approver: faris                      # every template PR is Class C: new, refresh, settings, delete
  in_guest_requirements: configuration-engineer   # homelab-infra docs/apps/vm-templates.md
  specs: "homelab-infra terraform/templates/hm1/<vmid>-<name>.yaml"
  builder: "svc-tpl-build@pve!pipeline"
  builder_ranges: [[9000, 9099]]       # Linux only; Windows 9100-9199 stays manual until an ISO/Packer path exists
  scratch: [9990, 9999]                # build and verify-clone VMIDs inside 'temporary'; deleted by the build job
  refresh_default: monthly
