# Zone code -> network (v7 gate test: Class C, Faris). Source: UniFi Networks page (design-v7 decision 22, 2026-10-07). Owner: Network Engineer (owners.yaml).
# CI (ci/check-unifi.py) fails a PR when vlan/cidr/gateway differ from UniFi.
# guests: whether the pipeline may place guests in the zone. A guest zone must be trunked on vmbr1 and routed by lox-coresw-01,
# except wifi (Faris decision 2026-10-09, decision 1 decided for wifi only): trunked on vmbr1, routed by lox-gw-01.
# ip_bands: allowed static ranges for guests (last octet, inclusive).
site: hm1
domain: lox-internal.dev
zones:
  mgt:
    name: Management-InternalServices
    vlan: 2
    cidr: 192.168.67.0/29
    gateway: 192.168.67.1
    bridge: vmbr0
    router: lox-coresw-01
    dhcp: none
    guests: false        # PVE host and OpenClaw (CT 100) only. Hard limit.
    vmid: [100, 199]
    pool: pool-mgt
  dmz:
    name: DMZ
    vlan: 10
    cidr: 192.168.71.0/24
    gateway: 192.168.71.1
    bridge: vmbr1
    router: lox-coresw-01
    guests: true
    vmid: [200, 299]
    pool: pool-dmz
    ip_bands: {static: [10, 99], vip: [200, 239]}
  shr:
    name: Shared Services
    vlan: 20
    cidr: 192.168.70.0/24
    gateway: 192.168.70.1
    bridge: vmbr1
    router: lox-coresw-01
    guests: true
    vmid: [300, 399]
    pool: pool-shr
    ip_bands: {static: [10, 99], vip: [200, 239]}
    reserved_ips:            # hand-built protected guests (not in homelab-infra specs)
      192.168.70.12: hm1-shr-vault01 (CT 303)
      192.168.70.20: hm1-shr-cicd01 (CT 300)
  int:
    name: Internal
    vlan: 40
    cidr: 192.168.72.0/24
    gateway: 192.168.72.1
    bridge: vmbr1
    router: lox-coresw-01
    guests: true
    vmid: [400, 499]
    pool: pool-int
    ip_bands: {static: [10, 99], vip: [200, 239]}
  stg:
    name: Staging (v7.1 decision 29)
    vlan: 60
    cidr: 192.168.76.0/24
    gateway: 192.168.76.1
    bridge: vmbr1
    router: lox-coresw-01
    dhcp: [100, 199]
    guests: true
    vmid: [800, 899]
    pool: pool-stg
    ip_bands: {static: [10, 99], vip: [200, 239]}
  tru:
    name: Trusted
    vlan: 50
    cidr: 192.168.73.0/28
    gateway: 192.168.73.1
    router: lox-gw-01
    guests: false
  iot:
    name: IoT
    vlan: 100
    cidr: 192.168.74.0/24
    gateway: 192.168.74.1
    router: lox-gw-01
    guests: false        # client network; decision 1 (deferred)
  wifi:
    name: WiFi
    vlan: 110
    cidr: 192.168.69.0/24
    gateway: 192.168.69.1
    bridge: vmbr1
    router: lox-gw-01    # gateway-routed: the one guest-zone exception (Faris, 2026-10-09)
    dhcp: [100, 254]     # UniFi WiFi DHCP pool
    guests: true         # client network that also hosts guests (decision 1 decided for wifi only)
    vmid: [500, 599]
    pool: pool-wifi
    ip_bands: {static: [10, 99]}   # no vip band: .200-.239 lies inside the DHCP pool
  gst:
    name: Guest
    vlan: 120
    cidr: 192.168.75.0/24
    gateway: 192.168.75.1
    router: lox-gw-01
    guests: false        # client network; decision 1 (deferred)
  net:
    name: Management-Ubiquiti
    vlan: 1
    cidr: 192.168.68.0/24
    gateway: 192.168.68.1
    router: lox-gw-01
    guests: false
  trn:
    name: Inter-VLAN routing
    vlan: 4040
    cidr: 10.255.253.0/24
    router: lox-gw-01
    dhcp: none
    guests: false
