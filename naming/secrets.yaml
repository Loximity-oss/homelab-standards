# Secrets naming and access rules (OpenBao on CT 303, https://192.168.70.12:8200). Faris-only.
mount: secret                 # KV v2
path_pattern: "^(hm1/(platform|dmz|shr|int|stg|wifi|iot)/[a-z0-9-]+(/[a-z0-9-]+)?|inbox/[a-z0-9-]{2,40})$"
scopes:
  platform: shared platform systems (cicd, ci/plan, ci/apply, ci/template, ci/apps, aiops)
  dmz: apps in the dmz zone
  shr: apps in the shr zone
  int: apps in the int zone
  stg: staging guests and test deploys
  wifi: guests in the wifi zone (AdGuard DNS)
  iot: guests in the iot zone (AdGuard DNS)
paths:                        # current fixed paths
  hm1/platform/cicd: Gitea passwords, Postgres passwords, devops-admin token (Faris)
  hm1/platform/ci/plan: pve_token_plan, pg_conn, gitea_ci_token (ci-plan, ci-apply)
  hm1/platform/ci/apply: pve_token_apply, gitea_apps_dispatch_token (ci-apply; the second dispatches homelab-apps deploy, bot ci-apps)
  hm1/platform/ci/apps: pve_token_apps (svc-apps@pve!pipeline), gitea_apps_token (bot ci-apps) (ci-apps only; homelab-apps)
  hm1/platform/ci/template: "pve_token_template (svc-tpl-build@pve!pipeline), gitea_ci_token (ci-template only; template builds, standards PR #17)"
  hm1/platform/aiops: OpenClaw tokens and credentials (aiops)
  inbox/<name>: agents' new secrets, write-only; Faris moves them to their final path
key_pattern: "^[a-z][a-z0-9_]*$"          # snake_case, e.g. gitea_token_oc_infra, pve_token_plan
approle_pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"   # <system>-<purpose>; AppRole name == policy name
rules:
  - No secrets in Git (no secrets/ directory, no *.sops.yaml, no plain tokens); gitleaks runs on every PR.
  - Every machine identity is an AppRole bound to its client IP (secret_id_bound_cidrs = token_bound_cidrs).
  - Policies and AppRoles are defined in openbao/ and applied by Faris (openbao/apply.sh). The pipeline never holds an OpenBao admin token.
  - Agents never read secrets; their tool processes get rendered values. inbox/* is create/update only.
